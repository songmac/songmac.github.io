name: Gists to Jekyll Posts

on:
  schedule:
    - cron: "7 0 * * *"      # 매일 00:07 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-gist-sync"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pyyaml markdown

      - name: Generate posts from Gists
        env:
          GH_USER: songmac
          # 시크릿/비공개 Gist까지 포함하려면 레포 시크릿에 PAT 저장(gist scope) 후 아래 사용
          GH_TOKEN: ${{ secrets.GH_GISTS_TOKEN }}
          BLOG_TAG: "[blog]"   # Gist description에 이 태그가 있을 때만 게시
        run: |
          python - << 'PY'
          import os, re, yaml, pathlib, requests, time, urllib.parse
          from datetime import datetime, timezone

          USER = os.environ["GH_USER"]
          TOKEN = os.environ.get("GH_TOKEN")
          BLOG_TAG = os.environ.get("BLOG_TAG", "[blog]").strip()

          POSTS = pathlib.Path("_posts"); POSTS.mkdir(exist_ok=True)
          HEADERS = {"Accept":"application/vnd.github+json"}
          if TOKEN:
            HEADERS["Authorization"] = f"Bearer {TOKEN}"

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, params=None):
            r = session.get(url, params=params, timeout=30)
            # 간단한 rate-limit 친화적 대기
            if r.status_code == 403 and "rate limit" in r.text.lower():
              time.sleep(5)
              r = session.get(url, params=params, timeout=30)
            r.raise_for_status()
            return r

          # 토큰 있으면 /gists (본인 Gist 전부), 없으면 공개만 보이는 /users/{user}/gists
          base_url = "https://api.github.com/gists" if TOKEN else f"https://api.github.com/users/{USER}/gists"

          page = 1
          total = 0
          while True:
            data = get(base_url, {"page":page,"per_page":100}).json()
            if not data: break
            for g in data:
              # 태그 필터: description에 [blog] 가 있을 때만
              desc = (g.get("description") or "").strip()
              if BLOG_TAG and BLOG_TAG not in desc:
                continue

              files = g.get("files") or {}
              # md 파일만 취급
              mdfile = next((v for v in files.values() if v["filename"].lower().endswith(".md")), None)
              if not mdfile:
                continue

              raw = get(mdfile["raw_url"]).text

              # 이미지/상대링크를 raw URL로 치환
              # ![alt](filename.png) -> 해당 파일의 raw_url
              def rewrite_links(text):
                def file_raw_url(fname):
                  f = files.get(fname) or next((v for v in files.values() if v["filename"]==fname), None)
                  return f["raw_url"] if f else fname
                def repl(m):
                  alt, url = m.group(1), m.group(2)
                  if re.match(r"^https?://", url): return m.group(0)
                  return f"![{alt}]({file_raw_url(url)})"
                text = re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", repl, text)
                return text
              raw = rewrite_links(raw)

              # 제목 추출
              m = re.search(r"^#\s+(.+)$", raw, re.M)
              title = (m.group(1).strip() if m else mdfile["filename"].rsplit(".",1)[0])

              # 날짜: front matter나 gist updated_at 사용
              updated = g.get("updated_at") or g.get("created_at")
              updated_date = updated[:10] if updated else datetime.now(timezone.utc).strftime("%Y-%m-%d")

              # 슬러그
              slug = re.sub(r"[^a-z0-9\-]+","-", title.lower()).strip("-") or g["id"]

              # front matter 구성
              fm = {
                "layout": "post",
                "title": title,
                "gist_id": g["id"],
                "original_gist": f"https://gist.github.com/{USER}/{g['id']}",
              }
              # description에서 tags: 태그1,태그2 형태를 읽어 태그로 넣기 (선택)
              mtags = re.search(r"tags?\s*:\s*([^\n]+)", desc, re.I)
              if mtags:
                tags = [t.strip() for t in re.split(r"[,\s]+", mtags.group(1)) if t.strip()]
                if tags:
                  fm["tags"] = tags

              name = f"{updated_date}-{slug}.md"
              path = POSTS / name

              # 이미 front matter가 있으면 유지, 없으면 주입
              if raw.lstrip().startswith("---"):
                content = raw
              else:
                content = f"---\n{yaml.safe_dump(fm, allow_unicode=True, sort_keys=False)}---\n\n{raw}"

              path.write_text(content, encoding="utf-8")
              total += 1
            page += 1

          print(f"Generated {total} posts into _posts/")
          PY

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Cross-post to Naver & Tistory (optional)
        if: ${{ env.ENABLE_CROSSPOST == '1' }}   # 필요할 때만 켜세요 (레포 변수/시크릿에서 ENABLE_CROSSPOST=1)
        env:
          ENABLE_CROSSPOST: ${{ vars.ENABLE_CROSSPOST }}
          NAVER_ACCESS_TOKEN: ${{ secrets.NAVER_ACCESS_TOKEN }}
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
        run: |
          python - << 'PY'
          import os, glob, re, requests, pathlib
          POSTS = sorted(glob.glob("_posts/*.md"))
          if not POSTS: raise SystemExit("No posts found")
          last = pathlib.Path(POSTS[-1])
          text = last.read_text(encoding="utf-8")

          # title 가져오기 (front matter 기준)
          m = re.search(r"^title:\s*\"?(.+?)\"?\s*$", text, re.M)
          title = m.group(1) if m else last.stem
          # front matter 제거
          content = re.sub(r"^---[\s\S]*?---\s*", "", text, count=1, flags=re.M)

          # ---- Tistory (HTML 권장) ----
          TISTORY_TOKEN = os.getenv("TISTORY_ACCESS_TOKEN")
          BLOG_NAME = os.getenv("TISTORY_BLOG_NAME")
          if TISTORY_TOKEN and BLOG_NAME:
            try:
              r = requests.post(
                "https://www.tistory.com/apis/post/write",
                data={
                  "access_token": TISTORY_TOKEN,
                  "output": "json",
                  "blogName": BLOG_NAME,
                  "title": title,
                  "content": content,
                  "visibility": 3,
                }, timeout=30
              )
              r.raise_for_status()
              print("Posted to Tistory ✅")
            except Exception as e:
              print("Tistory post failed:", e)

          # ---- Naver Blog ----
          NAVER_TOKEN = os.getenv("NAVER_ACCESS_TOKEN")
          if NAVER_TOKEN:
            try:
              r = requests.post(
                "https://openapi.naver.com/blog/writePost.json",
                headers={"Authorization": f"Bearer {NAVER_TOKEN}"},
                data={"title": title, "contents": content},
                timeout=30
              )
              r.raise_for_status()
              print("Posted to Naver ✅")
            except Exception as e:
              print("Naver post failed:", e)
          PY
